[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eldercare-rl-summative"
version = "0.1.0"
description = "Mission-based ElderCare reinforcement learning comparison project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium==1.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pygame==2.6.1",
    "pytest==9.2.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
    "torch==2.15.0",
    "torchrl==0.15.0",
]

[project.scripts]
eldercare-rl = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["environment", "training"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = true
